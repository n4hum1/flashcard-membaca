<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Belajar Membaca</title>
<style>
:root{--text:#1f2937;--muted:#6b7280;--blue:#2563eb;--green:#16a34a;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--text);padding:18px;transition:background-color .22s ease;background:#f5f6fa}
body.state-idle{background:#f5f6fa} body.state-ready{background:#dcfce7} body.state-listening{background:#dbeafe}
body.state-processing{background:#ffedd5} body.state-correct{background:#bbf7d0} body.state-wrong{background:#fee2e2}
.wrap{max-width:900px;margin:auto} h1{text-align:center}.sub{text-align:center;color:var(--muted);margin-bottom:22px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.level{border:0;background:#fff;border-radius:22px;padding:22px;text-align:left;box-shadow:0 8px 24px #00000010}
.level strong{display:block;font-size:22px;margin-bottom:5px}.level span{color:var(--muted);font-size:16px}
.game{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.back{border:0;border-radius:14px;padding:11px 14px;font-size:17px;font-weight:700}
.card{min-height:350px;background:#fff;border-radius:28px;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;box-shadow:0 12px 30px #00000012}
.target{font-size:clamp(70px,14vw,120px);font-weight:850;line-height:1.12}.syll:nth-child(odd){color:#2563eb}.syll:nth-child(even){color:#dc2626}
.feedback{text-align:center;min-height:48px;margin-top:16px;font-size:29px;font-weight:800}.heard{text-align:center;min-height:30px;color:var(--muted);font-size:17px}
.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:10px}.controls button{border:0;border-radius:18px;padding:16px 22px;font-size:20px;font-weight:750}
#mic{background:var(--blue);color:#fff;min-width:220px}#listen{background:#e5e7eb}.ok{color:var(--green)}.bad{color:var(--red)}button:disabled{opacity:.5}
.small{text-align:center;color:var(--muted);font-size:13px;margin-top:13px}
</style></head>
<body class="state-idle"><div class="wrap">
<section id="menu"><h1>Belajar Membaca</h1><div class="sub">Pilih latihan.</div><div class="levels">
<button class="level" data-level="upper"><strong>Huruf Besar</strong><span>A, B, C, D ...</span></button>
<button class="level" data-level="lower"><strong>Huruf Kecil</strong><span>a, b, c, d ...</span></button>
<button class="level" data-level="mixed"><strong>Huruf Campuran</strong><span>A, b, C, d ...</span></button>
<button class="level" data-level="syllable"><strong>Suku Kata</strong><span>ba, bi, bu, be, bo ...</span></button>
<button class="level" data-level="word2"><strong>Kata 2 Suku Kata</strong><span>Suku kata berbeda warna.</span></button>
<button class="level" data-level="word3"><strong>Kata 3 Suku Kata</strong><span>Kata lebih panjang.</span></button>
<button class="level" data-level="plain"><strong>Kata Tanpa Warna</strong><span>Latihan membaca kata utuh.</span></button>
</div></section>
<section id="game" class="game">
<div class="top"><button class="back" id="back">← Level</button><span id="progress"></span><strong id="score"></strong></div>
<div class="card"><div class="target" id="target"></div></div>
<div class="feedback" id="feedback"></div><div class="heard" id="heard"></div>
<div class="controls"><button id="listen">🔊 Dengarkan</button><button id="mic">🎤 Aktif Otomatis</button></div>
<div class="small" id="info"></div>
</section></div>
<script>
const BACKEND="https://flashcard-membaca-backend.vercel.app";
const letterNames={a:"a",b:"be",c:"ce",d:"de",e:"e",f:"ef",g:"ge",h:"ha",i:"i",j:"je",k:"ka",l:"el",m:"em",n:"en",o:"o",p:"pe",q:"ki",r:"er",s:"es",t:"te",u:"u",v:"ve",w:"we",x:"eks",y:"ye",z:"zet"};
const syllables=["ba","bi","bu","be","bo","ca","ci","cu","ce","co","da","di","du","de","do","fa","fi","fu","fe","fo","ga","gi","gu","ge","go","ha","hi","hu","he","ho","ja","ji","ju","je","jo","ka","ki","ku","ke","ko","la","li","lu","le","lo","ma","mi","mu","me","mo","na","ni","nu","ne","no","pa","pi","pu","pe","po","ra","ri","ru","re","ro","sa","si","su","se","so","ta","ti","tu","te","to"];
const words2=[["ba","ju"],["bo","la"],["bu","ku"],["ma","ta"],["sa","pi"],["ku","da"],["ro","ti"],["su","su"],["gi","gi"],["ja","ri"],["to","pi"],["na","si"],["pi","pi"],["ka","ki"],["pa","di"]];
const words3=[["ke","la","pa"],["se","pa","tu"],["ke","me","ja"],["ke","pa","la"],["pe","pa","ya"],["ce","la","na"],["se","pe","da"]];
const levels={
upper:{title:"Huruf Besar",api:"letter",items:[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"].map(x=>({text:x,answer:letterNames[x.toLowerCase()]}))},
lower:{title:"Huruf Kecil",api:"letter",items:[..."abcdefghijklmnopqrstuvwxyz"].map(x=>({text:x,answer:letterNames[x]}))},
mixed:{title:"Huruf Campuran",api:"letter",items:[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"].map((x,i)=>{let t=i%2?x.toLowerCase():x;return{text:t,answer:letterNames[x.toLowerCase()]}})},
syllable:{title:"Suku Kata",api:"syllable",items:syllables.map(x=>({text:x,answer:x}))},
word2:{title:"Kata 2 Suku Kata",colored:true,items:words2.map(p=>({parts:p,answer:p.join("")}))},
word3:{title:"Kata 3 Suku Kata",colored:true,items:words3.map(p=>({parts:p,answer:p.join("")}))},
plain:{title:"Kata Tanpa Warna",items:[...words2,...words3].map(p=>({text:p.join(""),answer:p.join("")}))}
};
let lvl=null,items=[],idx=0,correct=0,lastOfRound=null,wrongAttempts=0;
let captureToken=0,recording=false;
const $=id=>document.getElementById(id),menu=$("menu"),game=$("game"),target=$("target"),feedback=$("feedback"),heard=$("heard"),mic=$("mic");
function setState(s){document.body.className="state-"+s}
function norm(x){return(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]/g,"")}
function shuffleRound(source){let a=[...source];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}if(lastOfRound&&a.length>1&&a[0].answer===lastOfRound.answer)[a[0],a[1]]=[a[1],a[0]];return a}
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="id-ID";u.rate=.8;speechSynthesis.speak(u)}
function playCorrectSound(){try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),g=c.createGain(),n=c.currentTime;g.connect(c.destination);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.16,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+.4);[659.25,783.99].forEach((f,i)=>{let o=c.createOscillator();o.frequency.value=f;o.connect(g);o.start(n+i*.09);o.stop(n+.23+i*.09)});setTimeout(()=>c.close(),600)}catch(e){}}
function render(){let cfg=levels[lvl],it=items[idx];target.innerHTML="";if(cfg.colored)it.parts.forEach(p=>{let s=document.createElement("span");s.className="syll";s.textContent=p;target.appendChild(s)});else target.textContent=it.text;feedback.textContent="";feedback.className="feedback";heard.textContent="";$("progress").textContent=`${cfg.title} • ${idx+1}/${items.length}`;$("score").textContent=`Benar: ${correct}`;$("info").textContent=cfg.api?"Rekam lokal → trim → kirim clip":"Speech recognition browser"}
function start(name){captureToken++;recording=false;lvl=name;idx=0;correct=0;wrongAttempts=0;lastOfRound=null;items=shuffleRound(levels[lvl].items);menu.style.display="none";game.style.display="block";setState("idle");render();if(levels[lvl].api)setTimeout(()=>beginAuto(),500)}
function next(){wrongAttempts=0;idx++;if(idx>=items.length){lastOfRound=items[items.length-1];items=shuffleRound(levels[lvl].items);idx=0}render()}
document.querySelectorAll(".level").forEach(b=>b.onclick=()=>start(b.dataset.level));
$("back").onclick=()=>{captureToken++;recording=false;speechSynthesis.cancel();game.style.display="none";menu.style.display="block";setState("idle")};
$("listen").onclick=()=>speak(items[idx].answer);

function result(ok,label){
 heard.textContent=label?`Terdengar: ${label}`:"Suara belum terbaca";
 if(ok){
   wrongAttempts=0;correct++;setState("correct");feedback.textContent="✓ Benar!";feedback.className="feedback ok";$("score").textContent=`Benar: ${correct}`;playCorrectSound();
   setTimeout(()=>{next();setState("idle");if(levels[lvl].api)setTimeout(()=>beginAuto(),450)},700);
 }else{
   wrongAttempts++;setState("wrong");feedback.className="feedback bad";
   if(wrongAttempts>=2){
     feedback.textContent="Lewati dulu →";
     setTimeout(()=>{next();setState("idle");if(levels[lvl].api)setTimeout(()=>beginAuto(),450)},1000);
   }else{
     feedback.textContent="✗ Coba sekali lagi (1/2)";
     if(levels[lvl].api)setTimeout(()=>beginAuto(),850);
   }
 }
}

// Local VAD -> trimmed WAV
function rms(a){let s=0;for(const x of a)s+=x*x;return Math.sqrt(s/a.length)}
function concat(chunks){let n=chunks.reduce((a,c)=>a+c.length,0),o=new Float32Array(n),p=0;for(const c of chunks){o.set(c,p);p+=c.length}return o}
function resample(input,from,to){if(from===to)return input;let r=from/to,n=Math.floor(input.length/r),o=new Float32Array(n);for(let i=0;i<n;i++){let p=i*r,a=Math.floor(p),b=Math.min(a+1,input.length-1),t=p-a;o[i]=input[a]*(1-t)+input[b]*t}return o}
function wav(samples,sr){let b=new ArrayBuffer(44+samples.length*2),v=new DataView(b),str=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};str(0,"RIFF");v.setUint32(4,36+samples.length*2,true);str(8,"WAVE");str(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,"data");v.setUint32(40,samples.length*2,true);let o=44;for(const x of samples){let y=Math.max(-1,Math.min(1,x));v.setInt16(o,y<0?y*32768:y*32767,true);o+=2}return new Blob([b],{type:"audio/wav"})}
async function b64(blob){let a=new Uint8Array(await blob.arrayBuffer()),s="",step=32768;for(let i=0;i<a.length;i+=step)s+=String.fromCharCode(...a.subarray(i,i+step));return btoa(s)}

async function beginAuto(){
 if(recording||!levels[lvl]?.api)return;
 const token=++captureToken;recording=true;
 let stream,ctx,source,proc,done=false,started=false,frames=[],pre=[],silence=0,elapsed=0,noise=.008;
 const finish=async()=>{
   if(done)return;done=true;recording=false;
   try{proc.disconnect();source.disconnect()}catch(e){} try{stream.getTracks().forEach(t=>t.stop())}catch(e){}
   const sr=ctx.sampleRate;try{await ctx.close()}catch(e){}
   if(token!==captureToken)return;
   if(!frames.length){heard.textContent="Tidak ada suara terdeteksi";setState("wrong");setTimeout(()=>beginAuto(),700);return}
   let samples=concat(frames);
   const pad=Math.floor(sr*.14);
   if(samples.length>pad*2)samples=samples.slice(Math.max(0,pad/2),samples.length-Math.floor(pad/2));
   samples=resample(samples,sr,16000);
   const blob=wav(samples,16000);
   setState("processing");heard.textContent="Memeriksa...";
   try{
     const endpoint=levels[lvl].api==="letter"?"/api/classify-letter":"/api/classify-syllable";
     const r=await fetch(BACKEND+endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({audio:await b64(blob)})});
     const data=await r.json();if(!r.ok)throw new Error(data.error||("HTTP "+r.status));
     result(norm(data.label)===norm(items[idx].answer),data.label);
   }catch(e){setState("wrong");heard.textContent="API error: "+e.message;setTimeout(()=>beginAuto(),900)}
 };
 try{
   stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
   ctx=new (window.AudioContext||window.webkitAudioContext)();source=ctx.createMediaStreamSource(stream);proc=ctx.createScriptProcessor(1024,1,1);let sink=ctx.createGain();sink.gain.value=0;source.connect(proc);proc.connect(sink);sink.connect(ctx.destination);
   setState("ready");heard.textContent="🎤 Silakan ucapkan";
   proc.onaudioprocess=e=>{
     let a=new Float32Array(e.inputBuffer.getChannelData(0)),r=rms(a),ms=a.length/ctx.sampleRate*1000;elapsed+=ms;
     let threshold=Math.max(.018,noise*3);
     if(!started){
       noise=noise*.97+r*.03;pre.push(a);while(pre.length>Math.ceil(.18*ctx.sampleRate/a.length))pre.shift();
       if(r>threshold){started=true;frames=[...pre,a];pre=[];silence=0;setState("listening");heard.textContent="Mendengarkan..."}
       if(elapsed>3000&&!started)finish();
     }else{
       frames.push(a);if(r<Math.max(.014,noise*2.2))silence+=ms;else silence=0;
       if(silence>=420||elapsed>=4500)finish();
     }
   };
   setTimeout(finish,5000);
 }catch(e){recording=false;setState("wrong");heard.textContent="Mic error: "+e.message}
}
mic.onclick=()=>{if(levels[lvl]?.api){captureToken++;recording=false;setTimeout(()=>beginAuto(),150)}else if(rec){mic.disabled=true;heard.textContent="Mendengarkan...";try{rec.start()}catch(e){mic.disabled=false}}};

// Whole words retain browser speech recognition.
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=SR?new SR():null;
if(rec){rec.lang="id-ID";rec.interimResults=false;rec.maxAlternatives=10;rec.onresult=e=>{let arr=[];for(let i=0;i<e.results[0].length;i++)arr.push(e.results[0][i].transcript);result(arr.some(x=>norm(x)===norm(items[idx].answer)),arr[0])};rec.onerror=e=>{heard.textContent="Speech error: "+e.error;setState("wrong")};rec.onend=()=>mic.disabled=false}
</script></body></html>
