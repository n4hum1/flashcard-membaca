<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Belajar Membaca</title>
<style>
:root{--bg:#f5f6fa;--text:#1f2937;--muted:#6b7280;--blue:#2563eb;--green:#16a34a;--red:#dc2626}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--text);padding:18px}
.wrap{max-width:900px;margin:auto} h1{text-align:center;margin:10px 0 5px}.sub{text-align:center;color:var(--muted);margin-bottom:22px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.level{border:0;background:white;border-radius:22px;padding:22px;text-align:left;box-shadow:0 8px 24px #00000010}
.level strong{display:block;font-size:22px;margin-bottom:5px}.level span{color:var(--muted);font-size:16px}
.game{display:none}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.back{border:0;border-radius:14px;padding:11px 14px;font-size:17px;font-weight:700}
.card{min-height:350px;background:white;border-radius:28px;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;box-shadow:0 12px 30px #00000012}
.target{font-size:clamp(70px,14vw,120px);font-weight:850;line-height:1.12}.syll:nth-child(odd){color:#2563eb}.syll:nth-child(even){color:#dc2626}
.feedback{text-align:center;min-height:48px;margin-top:16px;font-size:29px;font-weight:800}.heard{text-align:center;min-height:30px;color:var(--muted);font-size:17px}
.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:10px}.controls button{border:0;border-radius:18px;padding:16px 22px;font-size:20px;font-weight:750}
#mic{background:var(--blue);color:white;min-width:220px}#listen{background:#e5e7eb}.ok{color:var(--green)}.bad{color:var(--red)}button:disabled{opacity:.5}
.small{text-align:center;color:var(--muted);font-size:13px;margin-top:13px}
</style>
</head>
<body><div class="wrap">
<section id="menu"><h1>Belajar Membaca</h1><div class="sub">Pilih latihan.</div>
<div class="levels">
<button class="level" data-level="upper"><strong>Huruf Besar</strong><span>A, B, C, D ...</span></button>
<button class="level" data-level="lower"><strong>Huruf Kecil</strong><span>a, b, c, d ...</span></button>
<button class="level" data-level="mixed"><strong>Huruf Campuran</strong><span>A, b, C, d ...</span></button>
<button class="level" data-level="syllable"><strong>Suku Kata</strong><span>ba, bi, bu, be, bo ...</span></button>
<button class="level" data-level="word2"><strong>Kata 2 Suku Kata</strong><span>Suku kata berbeda warna.</span></button>
<button class="level" data-level="word3"><strong>Kata 3 Suku Kata</strong><span>Kata lebih panjang.</span></button>
<button class="level" data-level="plain"><strong>Kata Tanpa Warna</strong><span>Latihan membaca kata utuh.</span></button>
</div></section>

<section id="game" class="game">
<div class="top"><button class="back" id="back">← Level</button><span id="progress"></span><strong id="score"></strong></div>
<div class="card"><div class="target" id="target"></div></div>
<div class="feedback" id="feedback"></div><div class="heard" id="heard"></div>
<div class="controls"><button id="listen">🔊 Dengarkan</button><button id="mic">🎤 Ucapkan</button></div>
<div class="small" id="info"></div>
</section></div>

<script>
const BACKEND="https://flashcard-membaca-backend.vercel.app";
const letterNames={a:"a",b:"be",c:"ce",d:"de",e:"e",f:"ef",g:"ge",h:"ha",i:"i",j:"je",k:"ka",l:"el",m:"em",n:"en",o:"o",p:"pe",q:"ki",r:"er",s:"es",t:"te",u:"u",v:"ve",w:"we",x:"eks",y:"ye",z:"zet"};
const syllables=["ba","bi","bu","be","bo","ca","ci","cu","ce","co","da","di","du","de","do","fa","fi","fu","fe","fo","ga","gi","gu","ge","go","ha","hi","hu","he","ho","ja","ji","ju","je","jo","ka","ki","ku","ke","ko","la","li","lu","le","lo","ma","mi","mu","me","mo","na","ni","nu","ne","no","pa","pi","pu","pe","po","ra","ri","ru","re","ro","sa","si","su","se","so","ta","ti","tu","te","to"];
const words2=[["ba","ju"],["bo","la"],["bu","ku"],["ma","ta"],["sa","pi"],["ku","da"],["ro","ti"],["su","su"],["gi","gi"],["ja","ri"],["to","pi"],["na","si"],["pi","pi"],["ka","ki"],["pa","di"]];
const words3=[["ke","la","pa"],["se","pa","tu"],["ke","me","ja"],["ke","pa","la"],["pe","pa","ya"],["ce","la","na"],["se","pe","da"]];
const levels={
 upper:{title:"Huruf Besar",rt:"letter",items:[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"].map(x=>({text:x,answer:letterNames[x.toLowerCase()]}))},
 lower:{title:"Huruf Kecil",rt:"letter",items:[..."abcdefghijklmnopqrstuvwxyz"].map(x=>({text:x,answer:letterNames[x]}))},
 mixed:{title:"Huruf Campuran",rt:"letter",items:[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"].map((x,i)=>{let t=i%2?x.toLowerCase():x;return{text:t,answer:letterNames[x.toLowerCase()]}})},
 syllable:{title:"Suku Kata",rt:"syllable",items:syllables.map(x=>({text:x,answer:x}))},
 word2:{title:"Kata 2 Suku Kata",colored:true,items:words2.map(p=>({parts:p,answer:p.join("")}))},
 word3:{title:"Kata 3 Suku Kata",colored:true,items:words3.map(p=>({parts:p,answer:p.join("")}))},
 plain:{title:"Kata Tanpa Warna",items:[...words2,...words3].map(p=>({text:p.join(""),answer:p.join("")}))}
};
let lvl=null,items=[],idx=0,correct=0,lastOfRound=null;
const $=id=>document.getElementById(id), menu=$("menu"),game=$("game"),target=$("target"),feedback=$("feedback"),heard=$("heard"),mic=$("mic");
function shuffleRound(source){
 let a=[...source]; for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 if(lastOfRound && a.length>1 && a[0].answer===lastOfRound.answer){[a[0],a[1]]=[a[1],a[0]]}
 return a;
}
function norm(x){return(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]/g,"")}
function start(name){lvl=name;idx=0;correct=0;lastOfRound=null;items=shuffleRound(levels[lvl].items);menu.style.display="none";game.style.display="block";render()}
function render(){
 let cfg=levels[lvl],it=items[idx];target.innerHTML="";
 if(cfg.colored){it.parts.forEach(p=>{let s=document.createElement("span");s.className="syll";s.textContent=p;target.appendChild(s)})} else target.textContent=it.text;
 feedback.textContent="";feedback.className="feedback";heard.textContent="";
 $("progress").textContent=`${cfg.title} • ${idx+1}/${items.length}`;$("score").textContent=`Benar: ${correct}`;
 $("info").textContent=cfg.rt?"OpenAI Realtime • satu session per soal":"Speech recognition browser";
}
function next(){
 idx++;
 if(idx>=items.length){lastOfRound=items[items.length-1];items=shuffleRound(levels[lvl].items);idx=0}
 render();
}
function result(ok,label){
 heard.textContent=label?`Terdengar: ${label}`:"Suara belum terbaca";
 if(ok){correct++;feedback.textContent="✓ Benar!";feedback.className="feedback ok";$("score").textContent=`Benar: ${correct}`;setTimeout(next,550)}
 else{feedback.textContent="✗ Coba lagi";feedback.className="feedback bad"}
}
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="id-ID";u.rate=.8;speechSynthesis.speak(u)}
document.querySelectorAll(".level").forEach(b=>b.onclick=()=>start(b.dataset.level));
$("back").onclick=()=>{speechSynthesis.cancel();game.style.display="none";menu.style.display="block"};
$("listen").onclick=()=>speak(items[idx].answer);

// Complete words: browser STT.
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=SR?new SR():null;
if(rec){rec.lang="id-ID";rec.interimResults=false;rec.maxAlternatives=10;rec.onresult=e=>{let arr=[];for(let i=0;i<e.results[0].length;i++)arr.push(e.results[0][i].transcript);result(arr.some(x=>norm(x)===norm(items[idx].answer)),arr[0])};rec.onerror=e=>{heard.textContent="Speech error: "+e.error};rec.onend=()=>mic.disabled=false}

// Realtime: one fresh WebRTC session per answer.
async function realtimeOnce(type){
 mic.disabled=true;feedback.textContent="";heard.textContent="Menyiapkan mikrofon...";
 let pc=null,stream=null,dc=null;
 try{
   const secretRes=await fetch(BACKEND+"/api/client-secret",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type})});
   const secretData=await secretRes.json();
   if(!secretRes.ok)throw new Error(secretData.error||"Gagal membuat session");
   const ephemeral=secretData.value || secretData.client_secret?.value;
   if(!ephemeral)throw new Error("Client secret tidak ditemukan");

   pc=new RTCPeerConnection();
   stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
   stream.getTracks().forEach(track=>pc.addTrack(track,stream));
   dc=pc.createDataChannel("oai-events");

   let finalText="",done=false,voiceStarted=false;
   const close=()=>{if(done)return;done=true;try{dc.close()}catch(e){}try{pc.close()}catch(e){}if(stream)stream.getTracks().forEach(t=>t.stop());mic.disabled=false};

   dc.onmessage=e=>{
     let ev;try{ev=JSON.parse(e.data)}catch(_){return}
     if(ev.type==="input_audio_buffer.speech_started"){voiceStarted=true;heard.textContent="Mendengarkan..."}
     if(ev.type==="response.output_text.delta"||ev.type==="response.text.delta") finalText+=ev.delta||"";
     if(ev.type==="response.output_text.done"||ev.type==="response.text.done") finalText=ev.text||finalText;
     if(ev.type==="response.done"){
       if(!finalText){
         const outputs=ev.response?.output||[];
         for(const o of outputs)for(const c of (o.content||[])) if(c.text) finalText+=c.text;
       }
       let label=norm(finalText)||"unknown";
       close();result(label===norm(items[idx].answer),label);
     }
     if(ev.type==="error"){let msg=ev.error?.message||"Realtime error";close();heard.textContent="Error: "+msg}
   };

   const offer=await pc.createOffer();await pc.setLocalDescription(offer);
   const sdpRes=await fetch("https://api.openai.com/v1/realtime/calls",{
     method:"POST",
     body:offer.sdp,
     headers:{"Authorization":"Bearer "+ephemeral,"Content-Type":"application/sdp"}
   });
   if(!sdpRes.ok)throw new Error(await sdpRes.text());
   await pc.setRemoteDescription({type:"answer",sdp:await sdpRes.text()});
   heard.textContent="Bicara sekarang...";

   // Prompt is configured server-side. VAD from published prompt ends the turn.
   // Hard timeout prevents a stuck "listening" state.
   setTimeout(()=>{if(!done){close();heard.textContent=voiceStarted?"Tidak mendapat hasil. Coba lagi.":"Tidak ada suara terdeteksi.";feedback.textContent="✗ Coba lagi";feedback.className="feedback bad"}},7000);
 }catch(e){
   try{pc?.close()}catch(_){}
   if(stream)stream.getTracks().forEach(t=>t.stop());
   mic.disabled=false;heard.textContent="Error: "+e.message;
 }
}
mic.onclick=()=>{
 if(levels[lvl].rt) realtimeOnce(levels[lvl].rt);
 else if(rec){mic.disabled=true;heard.textContent="Mendengarkan...";try{rec.start()}catch(e){mic.disabled=false}}
 else heard.textContent="Speech recognition browser tidak tersedia.";
};
</script></body></html>
